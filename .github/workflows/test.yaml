name: Test RTMP Stream

on:
  push:
    branches:
      - chore/add-test-rtmp
#   pull_request:
#     branches:
#       - main
#   workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      nginx-rtmp:
        image: alfg/nginx-rtmp:latest
        ports:
          - 1935:1935
          - 12345:80

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: docker-web-recorder:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker

      - name: Wait for nginx-rtmp to be ready
        shell: bash
        run: |
          timeout=30
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            if curl -f http://localhost:12345/stat > /dev/null 2>&1; then
              echo "nginx-rtmp is ready"
              exit 0
            fi
            echo "Waiting for nginx-rtmp... ($elapsed/$timeout seconds)"
            sleep 2
            elapsed=$((elapsed + 2))
          done
          echo "nginx-rtmp failed to start"
          exit 1

      - name: Start recorder container
        shell: bash
        run: |
          docker run -d \
            --name web-recorder \
            --network host \
            -e OUTPUT=rtmp://localhost:1935/stream/test_stream \
            -e URL=https://httpbin.org \
            -e RESOLUTION=1280x720 \
            -e RATE=1000 \
            docker-web-recorder:test

      - uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          architecture: 'x64'
          ffmpeg-version: '6.1.0'

      - name: Check video stream resolution
        shell: bash
        run: |
          echo "Checking video stream resolution..."
          expected_resolution="1280x720"
            
          ffmpeg -i http://localhost:12345/live/test_stream.m3u8 -map 0:v:0 -vframes 1 -f null -

      - name: Check container logs
        if: always()
        shell: bash
        run: |
          echo "=== Container logs ==="
          docker logs web-recorder || echo "Failed to get logs"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker stop web-recorder || true
          docker rm web-recorder || true
