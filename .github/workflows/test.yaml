name: Test RTMP Stream

on:
  push:
    branches:
      - chore/add-test-rtmp
#   pull_request:
#     branches:
#       - main
#   workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      nginx-rtmp:
        image: alfg/nginx-rtmp:latest
        ports:
          - 1935:1935
          - 8080:80

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: docker-web-recorder:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker

      - name: Wait for nginx-rtmp to be ready
        shell: bash
        run: |
          timeout=30
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            if curl -f http://localhost:8080/stat > /dev/null 2>&1; then
              echo "nginx-rtmp is ready"
              exit 0
            fi
            echo "Waiting for nginx-rtmp... ($elapsed/$timeout seconds)"
            sleep 2
            elapsed=$((elapsed + 2))
          done
          echo "nginx-rtmp failed to start"
          exit 1

      - name: Start recorder container
        shell: bash
        run: |
          docker run -d \
            --name web-recorder \
            --network host \
            -e OUTPUT=rtmp://localhost:1935/stream/test_stream \
            -e URL=https://httpbin.org \
            -e RESOLUTION=1280x720 \
            -e RATE=1000 \
            docker-web-recorder:test

      - uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Monitor stream for 5 seconds
        shell: bash
        run: |
          echo "Waiting for stream to start..."
          sleep 2

          for i in {1..5}; do
            echo "Checking stream status (attempt $i/5)..."
            stat_response=$(curl -s http://localhost:8080/stat || echo "")
            
            if echo "$stat_response" | grep -q "test_stream"; then
              echo "Stream detected in nginx-rtmp stats!"
              echo "$stat_response"
              exit 0
            fi
            
            if [ $i -lt 5 ]; then
              sleep 1
            fi
          done

          echo "Stream not detected in nginx-rtmp stats"
          echo "nginx-rtmp stats:"
          curl -s http://localhost:8080/stat || echo "Failed to get stats"
          exit 1

      - name: Check video stream resolution
        shell: bash
        run: |
          echo "Checking video stream resolution..."
          expected_resolution="1280x720"
          max_attempts=10
          attempt=0

          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts to probe stream..."
            
            actual_resolution=$(
              ffprobe -v error \
                -select_streams v:0 \
                -show_entries stream=width,height \
                -of csv=s=x:p=0 \
                -rw_timeout 5000000 \
                http://localhost:8080/live/test_stream.m3u8 2>&1 | head -n 1
            )
            
            if [ -n "$actual_resolution" ] && [ "$actual_resolution" != "" ]; then
              echo "Detected resolution: $actual_resolution"
              echo "Expected resolution: $expected_resolution"
              
              if [ "$actual_resolution" = "$expected_resolution" ]; then
                echo "✓ Resolution matches expected value: $expected_resolution"
                exit 0
              else
                echo "✗ Resolution mismatch! Expected: $expected_resolution, Got: $actual_resolution"
                exit 1
              fi
            fi
            
            if [ $attempt -lt $max_attempts ]; then
              sleep 1
            fi
          done

          echo "Failed to probe stream resolution after $max_attempts attempts"
          exit 1

      - name: Check container logs
        if: always()
        shell: bash
        run: |
          echo "=== Container logs ==="
          docker logs web-recorder || echo "Failed to get logs"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker stop web-recorder || true
          docker rm web-recorder || true
